# Link Apple's compiler-rt into iOS device builds.
#
# sqlite3.c (pulled in via rusqlite's bundled-sqlcipher feature) is compiled by
# clang, which references `___chkstk_darwin`. That symbol lives in Apple's
# libclang_rt.ios.a, not in Rust's compiler_builtins for aarch64-apple-ios, so
# the Rust link step fails with "undefined symbol ___chkstk_darwin" otherwise.
#
# NOTE: The path below is Xcode-version-specific (clang/<major>). After upgrading
# Xcode, update the path to match `xcrun --find clang | xargs -I{} {} -print-resource-dir`/lib/darwin.
[target.aarch64-apple-ios]
rustflags = [
  "-C", "link-arg=-L/Applications/Xcode.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/17/lib/darwin",
  "-C", "link-arg=-lclang_rt.ios",
]
