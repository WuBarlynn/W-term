name: Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --verbose
      - shell: pwsh
        run: ./scripts/verify-windows-version.ps1
      - name: Upload native asset logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-assets-logs
          path: |
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            build/native_assets/**
          if-no-files-found: ignore
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wterm-windows-release
          path: build/windows/x64/runner/Release/
