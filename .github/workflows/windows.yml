name: Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      OPENSSL_DIR: 'C:\Program Files\OpenSSL'
      OPENSSL_INCLUDE_DIR: 'C:\Program Files\OpenSSL\include'
      OPENSSL_LIB_DIR: 'C:\Program Files\OpenSSL\lib\VC\x64\MD'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: flutter pub get --enforce-lockfile
      - shell: pwsh
        run: |
          Write-Host "OPENSSL_DIR=$env:OPENSSL_DIR"
          Get-Item "$env:OPENSSL_INCLUDE_DIR\openssl\ssl.h", "$env:OPENSSL_LIB_DIR\libcrypto.lib" -ErrorAction Stop |
            Select-Object FullName
      - run: flutter build windows --release --verbose
      - shell: pwsh
        run: |
          if (-not (Test-Path "$env:OPENSSL_LIB_DIR\libcrypto.lib")) {
            Get-ChildItem "$env:OPENSSL_DIR" -Recurse -Filter libcrypto.lib | ForEach-Object { $_.FullName }
            throw "OpenSSL libcrypto.lib not found at $env:OPENSSL_LIB_DIR"
          }
          Get-ChildItem "$env:OPENSSL_DIR\bin\*crypto*.dll", "$env:OPENSSL_DIR\bin\*ssl*.dll" |
            Copy-Item -Destination "build\windows\x64\runner\Release"
          Get-ChildItem "build\windows\x64\runner\Release\*.dll" | Select-Object Name
      - shell: pwsh
        run: ./scripts/verify-windows-version.ps1
      - name: Smoke start Windows app
        shell: pwsh
        run: |
          $exe = Resolve-Path "build\windows\x64\runner\Release\wterm.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "wterm.exe exited early with code $($p.ExitCode)"
          }
          Write-Host "wterm.exe started successfully (PID $($p.Id))"
          Stop-Process -Id $p.Id -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = (Select-String -Path pubspec.yaml '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $parts = $version.Split('+')
          $short = $parts[0]
          $build = if ($parts.Length -gt 1) { $parts[1] } else { '0' }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DAppVersion=$short" "/DAppBuild=$build" installer\wterm.iss
          Get-ChildItem build\windows\installer
      - name: Smoke test silent installer
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Upload native asset logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-assets-logs
          path: |
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            build/native_assets/**
          if-no-files-found: ignore
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - uses: actions/upload-artifact@v4
        with:
          name: wterm-windows-release
          path: |
            build/windows/x64/runner/Release/
            build/windows/installer/*.exe
