[package]
name = "wterm_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rand = "0.10"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
base64ct = { version = "=1.8.3", features = ["alloc"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
